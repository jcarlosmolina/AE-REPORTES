apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ae-reportes
  labels:
    app: ae-reportes
    app.kubernetes.io/component: ae-reportes
    app.kubernetes.io/instance: ae-reportes
    app.kubernetes.io/name: ae-reportes
    app.kubernetes.io/part-of: ae-app
    app.openshift.io/runtime: ae-reportes
spec:
  source:
    type: Git
    git:
# Replace the placeholder below with the name of your GitHub username
      uri: "git@github.com:IntegranovaSoporteColSanitas/ae-reportes.git"
# Uncomment and adapt the line below if you need to reference a specific branch in the repository above
      ref: "publish"
# Uncomment and adapt the two lines below if you need to use credentials to access the (private) repository above
    sourceSecret:
      name: ae-git-credentials
  strategy:
    type: Docker
  output:
    to:
      kind: ImageStreamTag
      name: ae-reportes:latest
