apiVersion: apps/v1
kind: Deployment
metadata:
  name: ae-reportes
  labels:
    app: ae-reportes
    app.kubernetes.io/component: ae-reportes
    app.kubernetes.io/instance: ae-reportes
    app.kubernetes.io/name: ae-reportes
    app.kubernetes.io/part-of: ae-app
    app.openshift.io/runtime: ae-reportes
spec:
# Set the desired number of replicas
  replicas: 1
  selector:
    matchLabels:
      app: ae-reportes
  template:
    metadata:
      labels:
        app: ae-reportes
        deployment: ae-reportes
    spec:
      containers:
        - name: ae-reportes
# Replace the placeholder below with the name of your OpenShift namespace/project
          image: 'image-registry.openshift-image-registry.svc:5000/soporte-colsanitas-dev/ae-reportes:latest'
          ports:
            - containerPort: 8083
              protocol: TCP
          env:
# Replace the TZ env variable with your desired timezone. For a list of valid timezones see https://www.iana.org/time-zones
          - name: TZ
            value: 'America/Bogota'
          - name: quarkus.datasource.jdbc.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-database-jdbc-url
          - name: quarkus.datasource.username
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-username
          - name: quarkus.datasource.password
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: db-password
          - name: quarkus.rest-client.ae-apigateway.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-apigateway-url
          - name: quarkus.rest-client.ae-usuarios.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-usuarios-url
          - name: quarkus.rest-client.ae-configuraciones.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-configuraciones-url
          - name: quarkus.rest-client.ae-reportes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-reportes-url
          - name: quarkus.rest-client.ae-firmas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-firmas-url
          - name: quarkus.rest-client.ae-personas.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-personas-url
          - name: quarkus.rest-client.ae-solicitudes.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-solicitudes-url
          - name: quarkus.rest-client.ae-novedades.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-novedades-url
          - name: quarkus.rest-client.ae-generasolicitud.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-generasolicitud-url
          - name: quarkus.rest-client.ae-reportsgenerator.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: ae-reportsgenerator-url
# Configuracion general de integraciones con servicios de BH
          - name: com.keralty.integraciones.reactivacion_contratos.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: integraciones-reactivacion_contratos-url
          - name: com.keralty.integraciones.reactivacion_contratos.token.url
            valueFrom:
              configMapKeyRef:
                name: ae-config
                key: integraciones-reactivacion_contratos-token-url
          - name: com.keralty.integraciones.reactivacion_contratos.token.usr
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: integraciones-reactivacion_contratos-token-usr
          - name: com.keralty.integraciones.reactivacion_contratos.token.pwd
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: integraciones-reactivacion_contratos-token-pwd
          - name: com.keralty.integraciones.reactivacion_contratos.token.hash
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: integraciones-reactivacion_contratos-token-hash
          - name: com.keralty.integraciones.reactivacion_contratos.aeskey
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: integraciones-reactivacion_contratos-aeskey
          - name: com.keralty.integraciones.reactivacion_contratos.aessalt
            valueFrom:
              secretKeyRef:
                name: ae-secret
                key: integraciones-reactivacion_contratos-aessalt
# Set the values below according to your preferences to assign resources to this microservice
          resources:
            limits:
              cpu: 300m
              memory: 350Mi
            requests:
              cpu: 10m
              memory: 200Mi

